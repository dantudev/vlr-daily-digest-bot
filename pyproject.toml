[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlr-daily-digest-bot"
version = "1.0.0"
description = "Automated daily Valorant esports digest delivered to Telegram."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dantudev" }]
keywords = ["valorant", "esports", "telegram", "gemini", "digest", "bot"]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "google-genai>=0.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
vlr-digest = "vlr_digest.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# Long lines are handled by the formatter; allow them in strings/comments.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
# Ruff is the single source of truth for formatting (Black-compatible style).
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
