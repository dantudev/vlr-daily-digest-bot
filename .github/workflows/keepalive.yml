name: Keep Alive Workflow

on:
  schedule:
    # Runs every Monday at 00:00 UTC to check repository activity
    - cron: '0 0 * * 1'
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      # Required to allow the action to push dummy commits to the repository
      contents: write
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Run Keepalive Workflow Action
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          # Automatically pushes a dummy commit if there is no activity for 45 days
          time_elapsed: '45'
