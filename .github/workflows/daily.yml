name: Daily VLR Digest

on:
  schedule:
    # GitHub delays scheduled runs by hours, so trigger early and sleep until 12:00 Madrid.
    - cron: "13 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Wait until 12:00 Europe/Madrid
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=Europe/Madrid date -d 'today 12:00' +%s)
          wait=$(( target - $(date +%s) ))
          if (( wait > 0 )); then
            echo "Sleeping ${wait}s until 12:00 Europe/Madrid"
            sleep "$wait"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m vlr_digest
